[workspace]
resolver = "3"
members = [
    "crates/xtask",
    "crates/fmine-core",
    "crates/fmine-units",
    "crates/fmine-time",
    "crates/fmine-crs",
    "crates/fmine-evidence",
    "crates/fmine-claim",
    "crates/fmine-registry",
    "crates/fmine-array",
    "crates/fmine-runtime",
    "crates/fmine-authz",
    "crates/fmine-ledger",
    "crates/fmine-object",
    "crates/fmine-sync",
    "crates/fmine-telemetry",
    "crates/fmine-lab",
    "crates/fmine-numerics",
    "crates/fmine-materials",
    "crates/fmine-flow",
    "crates/fmine-recon",
    "crates/fmine-drill",
    "crates/fmine-qaqc",
    "crates/fmine-econ",
    "crates/fmine-explore",
    "crates/fmine-infer",
    "crates/fmine-geom",
    "crates/fmine-optimize",
    "crates/fmine-lp",
    "crates/fmine-calib",
    "crates/fmine-plant",
    "crates/fmine-decide",
    "crates/fmine-capital",
    "crates/fmine-io",
    "crates/fmine-public",
    "crates/fmine-projection",
    "crates/fmine-service",
    "crates/fmine-metrics",
    "crates/fmine-cli",
    "crates/fmine-report",
    "crates/fmine-view",
    "crates/fmine-gen",
    "crates/fmine-verify",
    "crates/fmine-derive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The only compiler ever used or tested: rust-toolchain.toml's nightly-2026-08-31 is rustc 1.100 (bd-l736;
# franken_surveillance_system declares the same). Clippy reads it as the MSRV for its version-gated lints.
rust-version = "1.100"
license = "MIT"
authors = ["Jeffrey Emanuel", "FrankenMining Contributors"]
repository = "https://github.com/Dicklesworthstone/franken_mining"
homepage = "https://github.com/Dicklesworthstone/franken_mining"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
# AGENTS.md: no unwrap/expect/panic in production code; tests may use them (clippy.toml allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.metadata.fmine]
production_language = "rust"
sole_async_runtime = "asupersync"
asupersync_pin = "=0.6.2"
dependency_policy = "deny.toml"
stack_lock = "franken-stack.lock"
loc_budget_registry = "registries/loc_budget.toml"
topology_registry = "registries/workspace_topology.toml"
lifts_registry = "registries/lifts.toml"

# One asupersync package for the whole graph (plan §27.5, INT-AS-001a check C): fsqlite takes it from crates.io,
# and this points that request at the revision franken-stack.lock pins (tag v0.6.2).
[patch.crates-io]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "a5d23e8dd2c8d776bd02e2da8e38e6296600e84c" }
