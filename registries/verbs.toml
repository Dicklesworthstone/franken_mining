# registries/verbs.toml — Robot & Operator CLI Verb Registry (§30.2, BD-031, BD-113)

schema_version = 1

[[verb]]
path = "assure public"
subsystem = "Bullion"
mutates_authority = true
description = "Run M0 Public Guidance & Reserve Assurance; --output records an authorized issuance of the exact report"

[[verb]]
path = "assure challenges"
subsystem = "Bullion"
mutates_authority = false
description = "Prepare cited internal-review evidence challenge packets from visible assurance exceptions"

[[verb]]
path = "check tables"
subsystem = "Bullion"
mutates_authority = false
description = "Inspect cited workbook identities or declared PDF sums and reserve roll-forwards under exact rounding rules"

[[verb]]
path = "guidance completion"
subsystem = "Bullion"
mutates_authority = false
description = "Compute remaining production and spending requirements from cited guidance under an explicit sales assumption"

[[verb]]
path = "mirror"
subsystem = "Bullion"
mutates_authority = false
description = "Compare cited JV production or sales assertions under explicit ownership and a common dated operating perimeter"

[[verb]]
path = "track-record"
subsystem = "Plumb"
mutates_authority = false
description = "Compare agreed issuer guidance with original annual outcomes, preserving missing members, comparative vintages and later appearances"

[[verb]]
path = "recovery gap"
subsystem = "Crucible"
mutates_authority = false
description = "Compare quarterly recovery with agreed historical grade and tails models, preserving rounding intervals and source evidence"

[[verb]]
path = "lint"
subsystem = "Portal"
mutates_authority = false
description = "Check bounded draft equalities against cited Claims or discover unambiguous source matches in a verified snapshot"

[[verb]]
path = "forecast assess"
subsystem = "Plumb"
mutates_authority = false
description = "Replay a frozen forecast cohort, retain missing outcomes, and optionally check all declared ancestry at registration with --provenance"

[[verb]]
path = "forecast record score"
subsystem = "Plumb"
mutates_authority = false
description = "Verify a frozen record and rules against explicit TSA roots, resolve original outcomes, and score paired registered baselines at an evidence cut"

[[verb]]
path = "forecast journal init"
subsystem = "Plumb"
mutates_authority = true
description = "Create an append-only forecast journal with a cell identity and declared host-clock uncertainty bound"

[[verb]]
path = "forecast journal register"
subsystem = "Plumb"
mutates_authority = true
description = "Register a forecast before its outcome deadline using runtime-assigned admission time under the journal writer lock"

[[verb]]
path = "forecast journal freeze"
subsystem = "Plumb"
mutates_authority = true
description = "Freeze cohort membership, eligible outcome sources and scoring policy before any member is due"

[[verb]]
path = "forecast journal outcome"
subsystem = "Plumb"
mutates_authority = true
description = "Append a published outcome, explicit missing status or cited restatement without replacing a forecast"

[[verb]]
path = "forecast journal assess"
subsystem = "Plumb"
mutates_authority = true
description = "Persist an immutable assessment and its closed information cut while retaining every frozen cohort member"

[[verb]]
path = "forecast journal inspect"
subsystem = "Plumb"
mutates_authority = false
description = "Replay and inspect a forecast journal, optionally checking an independently retained final-head digest"

[[verb]]
path = "forecast journal report"
subsystem = "Plumb"
mutates_authority = false
description = "Recover a persisted forecast assessment by exact digest, optionally checking supplied temporal provenance, without changing the journal"

[[verb]]
path = "reliance init"
subsystem = "Adit"
mutates_authority = true
description = "Create a local issuance journal bound to a release capability and explicit freshness policy"

[[verb]]
path = "reliance issue"
subsystem = "Adit"
mutates_authority = true
description = "Generate and record an assurance artifact with exact bytes, Claims, inputs, runtime binary and recipient role"

[[verb]]
path = "reliance reissue"
subsystem = "Adit"
mutates_authority = true
description = "Register another recipient copy after checking current reliance, preserving the selected issuance's producer metadata"

[[verb]]
path = "reliance check"
subsystem = "Adit"
mutates_authority = false
description = "Check issued-output status against independently trusted head and clock inputs, optionally verifying artifact bytes"

[[verb]]
path = "reliance reuse"
subsystem = "Adit"
mutates_authority = false
description = "Create a local copy only after verifying exact artifact bytes and current reliance status"

[[verb]]
path = "reliance withdraw"
subsystem = "Adit"
mutates_authority = true
description = "Append an authorized withdrawal with a reason, defect class and affected Claims"

[[verb]]
path = "reliance supersede"
subsystem = "Adit"
mutates_authority = true
description = "Append an authorized replacement link between recorded issued artifacts"

[[verb]]
path = "reliance refresh"
subsystem = "Adit"
mutates_authority = true
description = "Append an authorized current status cut without erasing withdrawals or supersessions"

[[verb]]
path = "reliance recall"
subsystem = "Adit"
mutates_authority = false
description = "List recorded local issuances affected by a declared code revision or Claim without contacting recipients"

[[verb]]
path = "claim show"
subsystem = "Plumb"
mutates_authority = false
description = "Display a Claim with its EvidenceClass, KnowledgeState, UuTerm, and provenance locators"

[[verb]]
path = "claim why"
subsystem = "Plumb"
mutates_authority = false
description = "Explain the epistemic color, flip margin, and staleness chain of a Claim"

[[verb]]
path = "claim trace"
subsystem = "Plumb"
mutates_authority = false
description = "Trace the upstream provenance DAG of a Claim back to raw cells or anchors"

[[verb]]
path = "doctor"
subsystem = "Adit"
mutates_authority = false
description = "Verify hash chains, high-water marks, foundation pins, LOC budgets, obligations, and Little's-law queues"

[[verb]]
path = "repair plan"
subsystem = "Adit"
mutates_authority = false
description = "Generate a deterministic truncation/rebuild repair plan for a torn segment or stale projection"

[[verb]]
path = "repair apply"
subsystem = "Adit"
mutates_authority = true
description = "Apply a verified repair plan by digest"

[[verb]]
path = "robot-docs"
subsystem = "Adit"
mutates_authority = false
description = "Emit machine-readable documentation for all CLI verbs, exit codes, and FMT-ENV-1 schemas"

[[verb]]
path = "robot schema"
subsystem = "Adit"
mutates_authority = false
description = "Emit the JSON schema for FMT-ENV-1 envelopes, Claims, DecisionCards, and Refusals"

[[verb]]
path = "assure issue"
subsystem = "Bullion"
mutates_authority = true
description = "Issue exact verified assurance bytes with canonical Claims, source manifest, build identity and recipient role"

[[verb]]
path = "reliance export"
subsystem = "Plumb"
mutates_authority = false
description = "Retrieve an existing issued artifact while retaining its pinned current-use journal lock"

[[verb]]
path = "recall"
subsystem = "Plumb"
mutates_authority = false
description = "List every recorded issued copy affected by a build revision or canonical Claim without contacting recipients"
