# registries/refclass.toml — Reference-Class Prior Registry (`REFCLASS-`, plan §9.3, BD-050, GATE-PLUMB-E4)
#
# Every ε-contaminated outside-view prior (`(1 - ε) * P_model + ε * Q`) MUST cite a row in this registry.
# Enforced by `fmine_claim::refclass` (`GATE-PLUMB-E4`: zero ε without a `RefClass`; zero `unverified`
# reference classes on disclosure-facing claims) and `cargo run -p xtask -- check-refclass` (`check-all`).

schema_version = 1

[[refclass]]
id = "REFCLASS-CAPEX-GREENFIELD"
domain = "capex_greenfield"
population = "Global greenfield base- and precious-metal mining capital projects at feasibility study"
n = 63
period = "1980-2001"
inclusion_rule = "Published feasibility-study initial capex vs. actual constructed capex in real terms"
similarity_justification = "Captures systematic engineering optimism and heavy right tail (+14% mean, ~1 in 13 >= +100% blowout; GB-32)"
status = "verified"
epsilon_bps = 2500
ref_mean_multiplier_bps = 12800
ref_std_multiplier_bps = 3500
source_document = "Bertisen & Davis (2008), Resources Policy 33(3):153-163; plan §9.3 GB-32"
source_e_ids = "E001,GB-32"

