# registries/calendars.toml — Site Production & Fiscal Calendars (§25.4, BD-031, BD-032)
# Each site names an IANA zone. Its UTC offsets, daylight saving included, come from registries/zones.toml, never
# from a fixed offset here (BD-029). fmine_registry::calendars loads both files and refuses any other field.

