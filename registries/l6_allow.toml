# L-6 allow-list (plan PO-UNIT-2; bd-u56b). `xtask check-claims` fails on every parameter typed bare `f64` in a
# `pub fn` of a K or E crate (fmine-numerics excepted) unless a row here names its crate, file, function and
# parameter. A row whose parameter no longer exists fails too.
#
# kind = "generic": dimensionless, or a statistical function over values in the caller's own unit.
# kind = "debt":    a physical quantity or money passed bare. It should become a typed quantity (fmine-units) or a
#                   Claim; bd-u56b stays open while any debt row remains. The debt rows record the sites that existed
#                   when this lint landed (2026-11-01). New code does not get one (AGENTS.md L-6: redesign the API).

[[allow]]
crate = "fmine-calib"
file = "src/ledger.rs"
fn = "register"
params = "mean, std_dev"
kind = "generic"
reason = "compatibility path: Gaussian forecast parameters in the forecast target's own unit; the ledger is unit-agnostic"

