# registries/refusals.toml — the FMINE-REF-* refusal registry, the single source (plan §8.4, §30.1; BD-328)
#
# One [[refusal]] row per code, in ascending code order. `cargo run -p xtask -- gen-refusals` writes the
# compiled catalogue, crates/fmine-evidence/src/refusal_catalog.rs, from this file; `check-refusals` (part of
# check-all) fails when that file differs, when an active row's "<nnn> <plan_text>" is not an item of its family's
# §8.4 row or a §8.4 code has no active row, when an exit code breaks the §30.1 family rule, when a crate names
# an unregistered code, or when a fix says to clamp.
#
# Fields, all required:
# - code: "FMINE-REF-nnn"; family: "<first digit>xx"; key: snake_case, the enum variant's stem.
# - exit_code: §30.1, 1xx and 2xx -> 3, 3xx and 4xx -> 7, 5xx -> 8 (digest or signature) or 6 (stale anchor).
#   Listed exceptions, in the check: 504 -> 7 (a safety refusal numbered 5xx) and 506 -> 5 (foundation I/O:
#   "a missing or unreadable registered input is a typed refusal that names the file, never a digest-mismatch
#   code").
# - status: active (a §8.4 code), proposed (awaiting the owner's plan amendment, docs/adr/ADR-REFUSALS-01.md;
#   reported as a warning) or reserved.
# - plan_text: the §8.4 phrase after the number, verbatim; for a proposed row, the phrase the ADR proposes.
# - what: the summary printed before a refusal's detail. fix: the remedy; it never says to clamp.

schema_version = 2

