[[refusal]]
code = "FMINE-REF-101"
exit_code = 3
category = "domain_law"
what = "Mass or metal conservation law violated beyond measurement tolerance (Sigma_in - Sigma_out - Delta_stock != 0)"
fix = "Inspect flow node balances or open a Touchstone reconciliation case; never insert a plug row."

