# Published cut-off grades and the inputs printed beside them (BD-274, plan §15; E182-E184).
#
# Every value is a token as the report prints it, so its rounding step is known: `fmine-metrics::cutoff` recomputes
# the grade on exact rationals at the printed inputs and at the ends of their rounding. The gold price is the
# report's assumption, not a measurement, so it is taken as exact.
#
# A row's cost, tax and royalty inputs are the ones the report uses. Cortez lists an AB495 rate in its text and leaves
# it out of the arithmetic, and its costs are in $/t while its cut-offs are in oz/st, so those rows carry no
# tax_percent and report in oz/st (E183).

schema = "fmine.published_cutoffs.v1"

[[cutoff]]
id = "turquoise-ridge-ug-resource"
document = "Turquoise Ridge Complex NI 43-101 Technical Report, March 2024"
page = 168
table = "Table 14-5"
evidence = "E182"
unit = "g/t"
published = "5.66"
gold_price_usd_per_oz = "1700"
cost_usd_per_t = "243.89"
royalty_percent = "0.00"
tax_percent = "1.02"
refining_usd_per_oz = "0.38"
recovery_intercept_percent = "100.79"
recovery_slope = "155.7"
tcm_percent = "0.771"

