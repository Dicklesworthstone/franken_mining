# registries/ffactors.toml — Site-Profile F-Factor and MCF Definitions Registry (BD-148, BD-278, plan §20.3–§20.5)
# Registries are data: every F-factor / MCF / RCF row carries a version, exact numerator/denominator
# nodes, quantity basis, spatial/temporal support, stockpile adjustment requirement (G-TOUCH-3),
# mutual-compensation threshold, and source Evidence IDs + locators.
# G-TOUCH-4 renders the full versioned registry key (never a bare "F1" or "MCF" label).

schema_version = 1

[[ffactor]]
id = "F1_tonnes"
version = 1
family = "F1"
site_profile = "open_pit_standard"
numerator_node = "grade_control"
denominator_node = "resource_model"
quantity_basis = "dry_tonnes"
support = "mined_polygon_period"
requires_stockpile_adjustment = false
mutual_comp_tol_bps = 500
source_e_ids = "R7_4_3"
source_locator = "plan:§20.4"
description = "Grade-control vs. resource-model dry tonnage ratio over mined polygon volume"

