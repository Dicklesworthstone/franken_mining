# registries/kernels.toml — Numerical Kernel Determinism & Thread-Count Registry (PO-NUM-3, plan §29.7, bd-dm2z)
#
# Every numerical kernel reachable from a certified path is listed here with its exact determinism class,
# threading mode, reduction order, caller thread control, runnable verification test, and cross-ISA scope.
# Enforced by `cargo run -p xtask -- check-kernels` (and `check-all`):
#   - No unlisted `std::thread::` numerical kernel in S0/K/E library code may qualify a certified path.
#   - Every listed K/E `source_file`'s `//! Determinism:` header must match `determinism_class`.
#   - Every `test_ref` must name an existing `fn` inside the declared crate.

schema_version = 1

[[kernel]]
id = "fmine-core.det.transcendentals"
crate = "fmine-core"
source_file = "crates/fmine-core/src/det.rs"
determinism_class = "BitwisePortable"
threading = "serial"
thread_control = "single-threaded (pure deterministic polynomial/rational evaluation)"
reduction_order = "fixed Horner polynomial evaluation; no parallel reduction"
certified_paths = "public-assurance,forecast-calibration,sbc-harness"
test_ref = "test:fmine-core::det::tests::test_det_exp_1_within_one_ulp"
cross_isa_ref = "BD-141 independent matrix (x86_64-linux + aarch64-darwin)"

