to = "fmine-units"

[[allowed_same_layer_edge]]
from = "fmine-claim"
to = "fmine-core"

[[allowed_same_layer_edge]]
from = "fmine-claim"
to = "fmine-units"

[[allowed_same_layer_edge]]
from = "fmine-claim"
to = "fmine-time"

[[allowed_same_layer_edge]]
from = "fmine-claim"
to = "fmine-evidence"

[[allowed_same_layer_edge]]
from = "fmine-registry"
to = "fmine-core"

[[allowed_same_layer_edge]]
from = "fmine-registry"
to = "fmine-units"

[[allowed_same_layer_edge]]
