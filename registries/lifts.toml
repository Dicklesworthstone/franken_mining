# registries/lifts.toml — provenance registry for code from frankensim (§27.1, L-7, BD-007, bd-5vex)
#
# [[lift]]: a file that really derives from `source` at `commit`. Its first line is the §27.1 header:
#   //! Provenance: frankensim <source> @ <commit>; licence <licence>; Changes: <...>; Left out: <...>
# `licence` is frankensim's: MIT with the OpenAI/Anthropic rider (LICENSE at the commit), under asupersync's
# SPDX-style id for the same text. Whether the rider is acceptable is RISK-17 (owner and counsel).
#
# [[analogue]]: original code with an upstream counterpart worth watching (GATE-FSIM-DRIFT). Nothing was copied,
# so it carries no provenance header and claims no licence from upstream. It opens with:
#   //! Original FrankenMining code (not lifted). Upstream analogue: frankensim <upstream> @ <short commit> (not copied).
# A real lift of one of these is a per-module decision under BD-022.
#
# `xtask check-lifts` checks all of this in CI; `check-lifts --upstream <path>` recomputes each sha256 locally.

schema_version = 2

