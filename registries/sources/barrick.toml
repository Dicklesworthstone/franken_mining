# bd-a28f.1: statuses that change how a subject's printed zeros read. A numeric zero in a period a disposal or
# a withholding covers is Nil with its token kept, never a value; a non-zero number there stays visible, flagged.
# Care and maintenance is recorded but leaves zeros as numbers.
# A disposal covers the periods that begin after its closing date, so the Q4 2025 stub and 2025 keep their
# numbers. Hemlo and Tongon print "—" in 2026 apart from numeric-zero recovery cells (E488).
# Loulo-Gounkoto: "no operating data or per ounce data was provided for Q1 2025 to Q3 2025" (E818).
# Long Canyon: no production or cost metrics from the first quarter of 2024 (E489).

