# ("W1 naming rule", INFERENCE). On 2026-10-30, repro/barrick/fetch.sh fetched all eight from a clean clone,
# and each served the registered bytes and sha256 with no redirect (E831): "fetched and verified 2026-10-30".
# The digest, not the URL, binds a run to its input. No affiliation: the issuer's files are public
# disclosures read as published.

