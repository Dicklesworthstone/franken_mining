# Barrick public-lane source registry (bd-s9j3.1, schema fmine.sources.v1). `fmine assure public --issuer
# barrick` reads it at run time from <workspace>/registries/sources/barrick.toml; it is never compiled into
# the binary. Registering a quarterly vintage is a data edit here: append its [[source]] rows (row order
# matters, because the state root binds sources in this order), widen retrieved_utc, then run
# `cargo run -p xtask -- check-all`, which applies the registry-check rules.
#
# Provenance (FACT): planning/research/W1_barrick_mine_stats.md sections 2.1-2.2 (E451, E452). All files were
# downloaded from the issuer's public CDN on 2026-10-29 between 03:35:00Z and 03:36:24Z. Mine Stats URLs are
# W1's table ("W1 table", FACT); the AISC workbook URLs follow W1's stated naming rule ("W1 naming rule",
# INFERENCE). The digest, not the URL, binds a run to its input. No affiliation: the issuer's files are
# public disclosures read as published.

schema = "fmine.sources.v1"
issuer = "barrick"
corpus_dir = "corpus_of_input_docs/downloaded/mine_stats"
retrieved_utc = "2026-10-29T03:35:00Z/03:36:24Z"
