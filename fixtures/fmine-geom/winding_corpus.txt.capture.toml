# Capture record (§33.2) for winding_corpus.txt: frankensim's own winding answers for fmine-geom's differential
# corpus (bd-192). scripts/oracle/winding_corpus/assemble.py copies upstream's fs-rep-mesh winding.rs and
# shapes.rs byte for byte (each checked against its sha256 at the commit), with lines 86-165 of fs-geom's lib.rs
# (Point3 and Vec3) as a one-file fs-geom crate; driver.rs, the only new code, builds 13 soups (upstream's cube,
# icosphere and corrupt generators, plus hand-written ones) and 1,264 query points (centres, random points,
# far points, vertices, face centroids, edge midpoints and points 1e-9 off a face) and prints upstream's
# winding_exact and WindingOctree answers at beta 1, 2 and 4. inputs_digest is the sha256 of the lines
# `sha256:<hex> <name>` for the three upstream files and driver.rs, as assemble.py prints it on stderr.
# rch returns a worker's stdout on stderr, so the file is the lines from the first `# fmine-geom` line to the
# last `end` line of that stream; the run was repeated on the same worker with identical bytes.
