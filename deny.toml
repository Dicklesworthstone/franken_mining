[bans]
multiple-versions = "deny"
# Path dependencies carry no version; with every workspace crate `publish = false` they are not wildcards.
wildcards = "deny"
allow-wildcard-paths = true
# fsqlite 0.5.1 and asupersync 0.6.2 entered with fmine-projection (BD-121). Each skip names the older version and
# what still takes it; the newer one is what the rest of the graph uses. The first nine are the pairs R7-C150
# expected with asupersync (FA's deny.toml at 41363acb skips the same ones). They come from the NATS key stack
# (asupersync -> nkeys 0.4 -> ed25519-dalek 2, signatory 0.27) on digest 0.10.
skip = [
    { crate = "block-buffer@0.10.4", reason = "digest 0.10 (nkeys -> ed25519-dalek 2 stack)" },
    { crate = "const-oid@0.9.6", reason = "der 0.7 (signatory -> pkcs8 0.10)" },
    { crate = "cpufeatures@0.2.17", reason = "curve25519-dalek 4 and sha2 0.10 (ed25519-dalek 2)" },
    { crate = "crypto-common@0.1.7", reason = "digest 0.10 (nkeys -> ed25519-dalek 2 stack)" },
    { crate = "digest@0.10.7", reason = "curve25519-dalek 4, sha2 0.10, signature 2 (nkeys -> ed25519-dalek 2)" },
    { crate = "getrandom@0.2.17", reason = "nkeys 0.4 and rand_core 0.6" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8, rand_chacha 0.3, signatory 0.27, signature 2 (nkeys)" },
    { crate = "sha2@0.10.9", reason = "ed25519-dalek 2 (nkeys); asupersync itself takes sha2 0.11" },
    { crate = "syn@2.0.119", reason = "derive crates not yet on syn 3: prost, tracing, zerocopy, zeroize, windows" },
    { crate = "rand@0.8.8", reason = "nkeys 0.4; fsqlite takes rand 0.10" },
    { crate = "hashbrown@0.14.5", reason = "dashmap 6 (fsqlite-pager); everything else takes hashbrown 0.17" },
    { crate = "lock_api@0.4.14", reason = "dashmap 6 (fsqlite-pager) and parking_lot 0.12 (asupersync)" },
    { crate = "parking_lot@0.12.5", reason = "asupersync 0.6.2; fsqlite 0.5.1 takes parking_lot 0.13" },
    { crate = "parking_lot_core@0.9.12", reason = "parking_lot 0.12 (asupersync) and dashmap 6 (fsqlite-pager)" },
    { crate = "nix@0.31.4", reason = "asupersync 0.6.2; fsqlite 0.5.1 takes nix 0.32" },
]

# Banned dependencies and public-API exposure (§28.5 L-5):
# - Foreign async runtimes / HTTP stacks: tokio, async-std, smol, hyper, reqwest, actix, axum, tower, tonic
# - Foreign DB / ORM / columnar / search stacks: sqlx, diesel, sea-orm, arrow, parquet, polars, duckdb, rusqlite,
#   petgraph, fastembed, tantivy
# - Foreign ML / C++ FFI stacks: ort, candle, tch, openssl, ring
# - Uncontrolled time in production closures: chrono and time reach the graph only through the listed suite
#   wrappers; cargo-deny matches wrappers against immediate parents only (R7-C152). fmine-time owns civil and
#   quad-temporal time, and `xtask check-deps` still bans both as direct dependencies of a workspace crate.
# `xtask check-deps` reads one `{ name = "..." }` row per line, so keep each row on one line.
deny = [
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    { name = "hyper" },
    { name = "reqwest" },
    { name = "actix-web" },
    { name = "axum" },
    { name = "tonic" },
    { name = "sqlx" },
    { name = "diesel" },
    { name = "sea-orm" },
    { name = "rusqlite" },
    { name = "duckdb" },
    { name = "arrow" },
    { name = "parquet" },
    { name = "polars" },
    { name = "petgraph" },
    { name = "fastembed" },
    { name = "tantivy" },
    { name = "ort" },
    { name = "candle-core" },
    { name = "tch" },
    { name = "openssl" },
    { name = "chrono", wrappers = ["x509-parser", "asn1-rs", "der-parser", "fsqlite-func", "fastmcp-server", "fp-types"] },
    { name = "time", wrappers = ["x509-parser", "asn1-rs", "der-parser", "fsqlite-func", "fastmcp-server", "fp-types"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
