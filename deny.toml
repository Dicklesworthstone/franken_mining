# deny.toml — FrankenMining Dependency & License Constitution (§28.5 Rule L-5)
# Enforced by `xtask check-deps` (direct dependencies) and `cargo deny` (the CI `deny` job, BD-326).

[graph]
# wasm32 is in rust-toolchain.toml, so its dependency graph is checked too.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "wasm32-unknown-unknown"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Never add LicenseRef-MIT-OpenAI-Anthropic-Rider here: rider crates are admitted only by name, below.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

# The workspace declares license = "MIT" (Cargo.toml [workspace.package]), but LICENSE reads "MIT License (with
# OpenAI/Anthropic Rider)" (E681). The field is the owner's to change; until then these exceptions are unused.
# Each is pending the RISK-17 owner/counsel decision.
[[licenses.exceptions]]
name = "fmine-array"
allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] # pending RISK-17 owner/counsel decision
