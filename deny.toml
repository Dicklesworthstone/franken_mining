[bans]
multiple-versions = "deny"
# Path dependencies carry no version; with every workspace crate `publish = false` they are not wildcards.
wildcards = "deny"
allow-wildcard-paths = true
skip = []
# When asupersync enters (WP-04), it brings nine duplicate pairs (R7-C150; FA's deny.toml at 41363acb skips the
# same ones). Add each with its reason then:
# skip = [
#     { name = "block-buffer" },
#     { name = "const-oid" },
#     { name = "cpufeatures" },
#     { name = "crypto-common" },
#     { name = "digest" },
#     { name = "getrandom" },
#     { name = "rand_core" },
#     { name = "sha2" },
#     { name = "syn" },
# ]

# Banned dependencies and public-API exposure (§28.5 L-5):
# - Foreign async runtimes / HTTP stacks: tokio, async-std, smol, hyper, reqwest, actix, axum, tower, tonic
# - Foreign DB / ORM / columnar / search stacks: sqlx, diesel, sea-orm, arrow, parquet, polars, duckdb, rusqlite,
#   petgraph, fastembed, tantivy
# - Foreign ML / C++ FFI stacks: ort, candle, tch, openssl, ring
# - Uncontrolled time in production closures: chrono and time reach the graph only through the listed suite
#   wrappers; cargo-deny matches wrappers against immediate parents only (R7-C152). fmine-time owns civil and
#   quad-temporal time, and `xtask check-deps` still bans both as direct dependencies of a workspace crate.
# `xtask check-deps` reads one `{ name = "..." }` row per line, so keep each row on one line.
deny = [
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    { name = "hyper" },
    { name = "reqwest" },
    { name = "actix-web" },
    { name = "axum" },
    { name = "tonic" },
    { name = "sqlx" },
    { name = "diesel" },
    { name = "sea-orm" },
    { name = "rusqlite" },
    { name = "duckdb" },
    { name = "arrow" },
    { name = "parquet" },
    { name = "polars" },
    { name = "petgraph" },
    { name = "fastembed" },
    { name = "tantivy" },
    { name = "ort" },
    { name = "candle-core" },
    { name = "tch" },
    { name = "openssl" },
    { name = "chrono", wrappers = ["x509-parser", "asn1-rs", "der-parser", "fsqlite-func", "fastmcp-server", "fp-types"] },
    { name = "time", wrappers = ["x509-parser", "asn1-rs", "der-parser", "fsqlite-func", "fastmcp-server", "fp-types"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
# The suite's GitHub organisation (Cargo.toml `repository`).
github = ["Dicklesworthstone"]
