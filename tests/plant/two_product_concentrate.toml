# Synthetic concentrate carries 250 kg dry matter, 40 kg Cu and 5 g Au.
schema = "fmine.plant-material.v1"
boundary = "synthetic-plant/v1"
material = "concentrate/period-1"
start_ns = "0"
end_ns = "10"
assay_basis = "total_element/all_non_water_dry_matter"
whole_material_support = "true"

[[mass]]
role = "wet"
value = "0.3"
unit = "t"

[[moisture]]
water_over_wet_mass = "1/6"

[[assay]]
element = "Au"
measurand = "total-Au/all-phases"
value = "20"
unit = "g_per_t"

[[assay]]
element = "Cu"
measurand = "total-Cu/all-phases"
value = "16"
unit = "mass_percent"
