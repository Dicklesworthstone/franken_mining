# SYNTHETIC one-tank history with no active opening-stock measurement or prior.
# Independent closed forms with a=exp(-1):
# O0=(1-a)*S+a*F0; O1=a*(1-a)*S+(1-a)^2*F0+a*F1.
# Observed F0=10 and the two outlets identify S=2 and the missing F1=4 kg.
# Outlet decimals were evaluated from these formulas, not the RTD implementation.
# The three genuine observations have a declared full correlated covariance.
schema = "fmine.plant-rtd-inverse.v3"
boundary = "synthetic-inverse-unmeasured-opening/v1"
element = "Au"
measurand = "total-Au/all-phases"
mass_basis = "kg-total/all-phases/full-physical-boundary"
start_ns = "0"
end_ns = "2000000000"
opening_ns = "0"
tanks = "1"
volume_m3 = "1"
bypass_fraction = "0"
dead_fraction = "0"
min_flow_m3_per_s = "0"
max_flow_m3_per_s = "2"
common_conservative_transport = "true"
piecewise_constant_feed_per_volume = "true"
dry_tolerance_kg = "0.00000001"
water_tolerance_kg = "0.00000001"
element_tolerance_kg = "0.00000001"
max_kernel_steps = "128"
error_model_basis = "synthetic correlated feed and outlet observations; illustrative covariance, not empirical calibration"
fixed_transport = "true"
opening_treatment = "unmeasured"
unbiased_gaussian_errors = "true"
global_chi_square_limit = "10"
closure_tolerance_kg = "0.00000001"

[[opening]]
tank = "dead"
dry_kg = "0"
water_kg = "0"
element_kg = "0"

[[interval]]
start_ns = "0"
end_ns = "1000000000"
slurry_volume_m3 = "1"
feed_kg = "10"
outlet_kg = "4.943035529371538572764190161"

[[interval]]
start_ns = "1000000000"
end_ns = "2000000000"
slurry_volume_m3 = "1"
feed_kg = "unmeasured"
outlet_kg = "5.932370089492709032814663178"

[[covariance]]
left = "feed/0/1000000000"
right = "feed/0/1000000000"
kg2 = "0.04"

[[covariance]]
left = "feed/0/1000000000"
right = "outlet/0/1000000000"
kg2 = "0.01"

[[covariance]]
left = "feed/0/1000000000"
right = "outlet/1000000000/2000000000"
kg2 = "-0.005"

[[covariance]]
left = "outlet/0/1000000000"
right = "outlet/0/1000000000"
kg2 = "0.09"

[[covariance]]
left = "outlet/0/1000000000"
right = "outlet/1000000000/2000000000"
kg2 = "0.02"

[[covariance]]
left = "outlet/1000000000/2000000000"
right = "outlet/1000000000/2000000000"
kg2 = "0.16"
