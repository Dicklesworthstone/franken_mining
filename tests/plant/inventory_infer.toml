# ASSUMPTION: synthetic closing-stock inference; no operating data or calibration.
# Closing = opening + feed - product = [110 dry, 55 water, 1.1 Au] kg.
# Independent observed variances add to [6, 1.5, 0.0006] kg2 at closing.
# The opening dry/Au covariance 0.02 kg2 also appears in inferred closing.
# Closing has no observation, source ClaimId, prior, or fabricated covariance.
schema = "fmine.plant-unmeasured.v2"
boundary = "synthetic-unmeasured-closing/v1"
basis = "kg/dry-matter+water/total-elements/all-phases/full-boundary"
start_ns = "0"
end_ns = "10"
complete = "true"
unbiased_gaussian_errors = "true"
global_chi_square_limit = "9"
error_model_basis = "Synthetic Gaussian observed errors; only opening dry/Au are correlated; no inventory prior"

[[unit]]
id = "store"
kind = "storage"

[[stream]]
id = "feed"
kind = "feed"
to = "store"

[[stream]]
id = "product"
kind = "product"
from = "store"

[[unmeasured_stocktake]]
unit = "store"
kind = "closing"

[[element]]
symbol = "Au"
measurand = "total-Au/all-phases"

[[coordinate]]
observation = "opening:store"
channel = "dry"
kg = "100.000"
start_ns = "0"
end_ns = "0"

[[coordinate]]
observation = "opening:store"
channel = "water"
kg = "50"
start_ns = "0"
end_ns = "0"

[[coordinate]]
