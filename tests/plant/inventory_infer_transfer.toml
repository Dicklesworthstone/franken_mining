# ASSUMPTION: synthetic two-store transfer; no operating data or calibration.
# Closing a = opening a - transfer; closing b = opening b + transfer.
# Both inferred closings are [70 dry, 35 water, 0.7 Au] kg.
# Their cross-covariance is -Var(transfer) = [-1, -0.25, -0.0001] kg2.
# The shared transfer cancels from the boundary total and its variance.
schema = "fmine.plant-unmeasured.v2"
boundary = "synthetic-shared-transfer-inventory/v1"
basis = "kg/dry-matter+water/total-elements/all-phases/full-boundary"
start_ns = "0"
end_ns = "10"
complete = "true"
unbiased_gaussian_errors = "true"
global_chi_square_limit = "9"
error_model_basis = "Synthetic independent Gaussian observations; no priors or measurements of closing stock"

[[unit]]
id = "a"
kind = "storage"

[[unit]]
id = "b"
kind = "storage"

[[stream]]
id = "shared"
kind = "internal"
from = "a"
to = "b"
source_role = "product"

[[unmeasured_stocktake]]
unit = "a"
kind = "closing"

[[unmeasured_stocktake]]
unit = "b"
kind = "closing"

[[element]]
symbol = "Au"
measurand = "total-Au/all-phases"

[[coordinate]]
observation = "opening:a"
channel = "dry"
kg = "100"
start_ns = "0"
end_ns = "0"

[[coordinate]]
observation = "opening:a"
channel = "water"
kg = "50"
start_ns = "0"
end_ns = "0"

