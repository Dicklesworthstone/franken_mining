# SYNTHETIC, hand-computable two-period stock trajectory. No empirical plant claim.
# Before the final survey: stocks are 10,12,15 kg, with variance 1,3,5 kg2.
# Final survey at 20 kg creates residual -5; equal independent variances give
# chi-square 25/6, stocks 65/6,29/2,115/6, and middle-stock variance 3/2.
schema = "fmine.plant-trajectory.v1"
boundary = "synthetic-single-stockpile-v1"
element = "Au"
measurand = "total-Au/all-phases"
basis = "kg-total-element/all-phases/full-physical-boundary"
start_ns = "0"
end_ns = "20"
complete = "true"
error_model_basis = "synthetic independent unit-variance measurements; not empirical sensor calibration"
unbiased_gaussian_errors = "true"
global_chi_square_limit = "10"
closure_tolerance_kg = "0.00000001"

[[period]]
start_ns = "0"
end_ns = "10"
inflow_kg = "5"
outflow_kg = "3"

[[period]]
start_ns = "10"
end_ns = "20"
inflow_kg = "7"
outflow_kg = "4"

[[stocktake]]
at_ns = "0"
kg = "10"

[[unmeasured_stocktake]]
at_ns = "10"

[[stocktake]]
at_ns = "20"
kg = "20"

[[covariance]]
left = "stock/0"
right = "stock/0"
kg2 = "1"

[[covariance]]
left = "stock/0"
right = "stock/20"
kg2 = "0"

[[covariance]]
left = "stock/0"
right = "inflow/0/10"
kg2 = "0"

[[covariance]]
left = "stock/0"
right = "inflow/10/20"
kg2 = "0"

[[covariance]]
left = "stock/0"
right = "outflow/0/10"
kg2 = "0"

[[covariance]]
left = "stock/0"
right = "outflow/10/20"
kg2 = "0"

[[covariance]]
left = "stock/20"
right = "stock/20"
kg2 = "1"

[[covariance]]
left = "stock/20"
right = "inflow/0/10"
kg2 = "0"

[[covariance]]
left = "stock/20"
right = "inflow/10/20"
kg2 = "0"

[[covariance]]
left = "stock/20"
right = "outflow/0/10"
kg2 = "0"

[[covariance]]
left = "stock/20"
right = "outflow/10/20"
kg2 = "0"

[[covariance]]
left = "inflow/0/10"
right = "inflow/0/10"
kg2 = "1"

[[covariance]]
left = "inflow/0/10"
right = "inflow/10/20"
kg2 = "0"

[[covariance]]
left = "inflow/0/10"
right = "outflow/0/10"
kg2 = "0"

[[covariance]]
