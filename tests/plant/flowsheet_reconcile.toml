# ASSUMPTION: synthetic fully measured mill/classifier recycle; no operating data.
# Shared dry transfer is deliberately 121 kg, one kg above exact unit closure.
# Outer dry residual is zero, while unit A/B residuals are -1/+1 kg.
# Independent constructed covariance has unit variances; EVERY zero is explicit.
# Hand oracle: residual covariance [[5,-2],[-2,5]], chi-square = 2/7.
schema = "fmine.plant-flowsheet.v1"
boundary = "synthetic-recycle/v1"
basis = "kg/dry-matter+water/total-elements/all-phases/full-boundary"
start_ns = "0"
end_ns = "10"
complete = "true"
unbiased_gaussian_errors = "true"
global_chi_square_limit = "9"
error_model_basis = "Synthetic unit-variance independent Gaussian errors, explicitly declared for this example only"

[[unit]]
id = "a"
kind = "mill"

[[unit]]
id = "b"
kind = "classifier"

[[stream]]
id = "feed"
kind = "feed"
to = "a"

[[stream]]
id = "shared"
kind = "internal"
from = "a"
to = "b"
source_role = "product"

