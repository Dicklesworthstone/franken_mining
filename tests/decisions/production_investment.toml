# SYNTHETIC two-period comparison; paths are relative to the workspace root.
# Factors 1 and 1/2 are explicit demonstration multipliers, not annual interest rates.
# Initial capex reverses the operating choice: process 6592.4 USD, higher-power 5684.8 USD.
schema = "fmine.production-investment.v1"
model_key = "synthetic-two-period-investment"
question = "Fund the original or higher-power alternative for these two declared periods, or do nothing?"
shared_scenario_basis = "SYNTHETIC persistent soft or hard ore and price state across both periods and both mutually exclusive investments"
discount_basis = "SYNTHETIC explicit present-value multipliers at time zero; no annual rate or settlement timing is inferred"
cashflow_basis = "incremental_operating_cash_excludes_initial_capex"
currency = "USD"
valuation_time_ns = "0"
boundary = "synthetic-plant/v1"
circuit = "synthetic-ball-mill"
material_domain = "invented-ore-domain"
dry_basis = "total-non-water-dry-matter/v1"
element = "Au"
commercial_support = "Synthetic payable Au from exactly this one-hour recovered-metal population"
monetary_rounding = "nearest_ties_even_0_0001_usd"

[[period]]
id = "first"
start_ns = "0"
end_ns = "3600000000000"
discount_factor = "1"

[[period]]
id = "second"
start_ns = "3600000000000"
end_ns = "7200000000000"
discount_factor = "1/2"

[[alternative]]
id = "process"
label = "Initial investment in the original operating mode"
initial_capex_usd = "1000"

[[alternative]]
id = "higher-power"
label = "Initial investment in the higher-power mode"
initial_capex_usd = "8000"

[[bundle]]
alternative = "process"
period = "first"
input = "tests/plant/production_joint.toml"
grinding = "tests/plant/grinding_joint.toml"
recovery = "tests/plant/production_recovery.toml"
terms = "tests/decisions/production_valuation.toml"

[[bundle]]
alternative = "higher-power"
period = "first"
input = "tests/plant/production_joint.toml"
grinding = "tests/plant/grinding_higher_power.toml"
recovery = "tests/plant/production_recovery.toml"
terms = "tests/decisions/production_valuation_higher_power.toml"

[[bundle]]
alternative = "process"
period = "second"
input = "tests/plant/investment_second_production.toml"
grinding = "tests/plant/investment_second_grinding.toml"
recovery = "tests/plant/investment_second_recovery.toml"
terms = "tests/decisions/investment_second_valuation.toml"

[[bundle]]
alternative = "higher-power"
period = "second"
input = "tests/plant/investment_second_production.toml"
grinding = "tests/plant/investment_second_grinding_high.toml"
recovery = "tests/plant/investment_second_recovery.toml"
terms = "tests/decisions/investment_second_valuation_high.toml"

[[uu]]
id = "UU-synthetic-investment-horizon"
description = "Invented unmodelled commissioning costs and cash outside the declared two-period window"
trigger = "Initial expenditure or excluded cash differs from this explicit comparison"
downside_usd_m = "0.03"
