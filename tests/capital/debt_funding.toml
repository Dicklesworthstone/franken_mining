# Invented debt-funded JV and paid-information example; no issuer lending terms are inferred.
# Parent/JV begin with USD 25/20 and separate USD 20 floors. The study costs Parent USD 5.
# JV opens with USD 100 debt. After Good/Bad is observed, its native receipt and CFADS are 130/30.
# Period-two interest is 10 and principal service 20; DSCR is 13/3 or 1 against a 3/2 threshold.
# Good sweeps 50, leaving debt 30, then pays a gross 50 dividend: Parent 30/outside 20. Bad pays none.
# Parent builds the USD 20 project only after Good; study+project NAV is 95, abandonment NAV is -5.
# The study also commits a final principal payment of 1 in BOTH states, including abandonment.
# Final interest is USD 3 after Good and USD 8 after Bad; ending debt is 29/79 and Parent cash is 30/20.
# Mean NAV 45 and tail loss 5 become 9/20 and 1/20 USD/share with 100 shares. Hold is best static.
# Debt cash is excluded from native flows; declared candidate NAV is already net of financing economics
# and is not adjusted again.
schema = "fmine.capital-program.v1"
model_key = "invented_debt_covenants_and_recourse"
question = "Which Parent policy remains funded after JV debt service, coverage locks and cash sweeps?"
currency = "USD"
valuation_basis = "Invented Parent equity NAV including its JV interest; study and project payoffs already net of financing and commitment economics"
budget = "25"
tail_mass = "1/5"
payoff_convention = "additive_equity_nav_with_share_changes"
reference_class_basis = "Invented exact contract inputs and uncalibrated shared-state probabilities"

