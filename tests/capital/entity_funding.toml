# Invented entity funding and paid-information example; no issuer evidence or legal permission is inferred.
# Parent begins with USD 25, JV with USD 20, and each entity has its own USD 20 cash floor.
# The initial study costs USD 5 before Good/Bad is observed at the second period's opening.
# Good brings USD 100 into the JV. Its declared distribution pays USD 60 to Parent and USD 40 outside.
# Parent can fund the USD 50 project in the third period only after Good; after Bad it abandons.
# Good/Bad NAV changes are 95/-5, averaging USD 45. With 100 shares, the mean is 9/20 USD/share.
# The upper-tail loss is USD 5, or 1/20 USD/share, exactly the declared limit.
# Parent closes at USD 30/20. Constant study+project fails Bad's parent cash floor by USD 50.
# Best feasible static action is hold, making net adaptive value 9/20 USD/share.
schema = "fmine.capital-program.v1"
model_key = "invented_entity_funding_and_recourse"
question = "Which funded policy creates value for Parent while respecting the JV cash perimeter?"
currency = "USD"
valuation_basis = "Invented Parent equity NAV including its JV interest; candidate values already net of project and study costs"
budget = "55"
tail_mass = "1/5"
payoff_convention = "additive_equity_nav_with_share_changes"
reference_class_basis = "Invented exact parameters and uncalibrated shared-state probabilities"

[[state]]
id = "good"
weight = "1/2"

[[state]]
id = "bad"
weight = "1/2"

[[candidate]]
id = "study"
label = "Invented paid study"
cost = "5"
reference_class_basis = "Declared USD 5 sunk study cost and a paid Good/Bad observation"

[[candidate]]
id = "project"
label = "Invented parent project"
cost = "50"
reference_class_basis = "Declared USD 50 third-period cash need and scenario-specific already-net Parent NAV"

[[payoff]]
