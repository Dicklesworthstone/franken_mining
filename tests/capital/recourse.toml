# Invented two-stage equity and cash example; no issuer data or calibrated probabilities.
# Pay USD 10 for the study before observing Good or Bad. That cost remains on abandonment.
# Good: issue 20 shares for USD 160 net proceeds, then fund the USD 100 project.
# Bad: abandon the recourse projects. Do not select the high-USD but dilutive issuance.
# Good ending NAV/share = 1250/120; Bad = 990/100; baseline = 1000/100.
# Expected change in NAV/share = ((5/12) + (-1/10))/2 = 19/120 USD/share.
# Expected total NAV change is USD 120. Good final cash is 80; Bad final cash is 20.
# The best feasible static program is hold, so net adaptive value is also 19/120 USD/share.
# The complete bounded population has 4 unobserved uniform policies and 16 adaptive policies.
schema = "fmine.capital-program.v1"
model_key = "invented_two_stage_equity_and_cash"
question = "Which paid-information policy creates the most NAV per ordinary share while meeting every cash floor?"
currency = "USD"
valuation_basis = "Invented decision-date total parent equity NAV; project payoffs already net of costs and issuance includes net proceeds"
budget = "110"
tail_mass = "1/5"
payoff_convention = "additive_equity_nav_with_share_changes"
reference_class_basis = "Invented exact accounting assumptions and uncalibrated shared-state probabilities"

[[state]]
id = "good"
weight = "1/2"

[[state]]
id = "bad"
weight = "1/2"

[[candidate]]
id = "study"
label = "Invented paid feasibility study"
cost = "10"
reference_class_basis = "Declared USD 10 sunk cost; the study distinguishes only the named information classes"

[[candidate]]
id = "issue"
label = "Invented contingent equity issuance"
cost = "0"
reference_class_basis = "Declared 20 additional shares for USD 160 net proceeds after study completion"

[[candidate]]
id = "project"
label = "Invented contingent construction project"
cost = "100"
reference_class_basis = "Declared USD 100 construction funding; scenario NAV changes already include project costs"

[[payoff]]
candidate = "study"
state = "good"
value = "-10"

[[payoff]]
candidate = "study"
state = "bad"
value = "-10"

[[payoff]]
