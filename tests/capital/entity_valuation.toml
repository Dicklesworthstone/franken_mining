# DESIGN: invented Parent/carve-out comparison with independent valuation denominators.
# Parent begins at NAV 1000 / 100 shares; carve-out at NAV 600 / 60 shares.
# Parent pays 10 for a study, with already-net NAV changes of -10 Parent and -6 carve-out.
# Good produces a prior 50 carve-out cash receipt: 30 reaches Parent and 20 goes outside.
# Both possible terminal deals cost Parent 20 and require the study. They are mutually exclusive.
# The aggressive deal benefits Parent but issues 30 carve-out shares; its Good child delta/share is -31/15.
# The fair deal issues 6 carve-out shares. Study then fair only after Good gives child 720/66 vs 600/60,
# a delta/share of 10/11; Bad retains the study's -6 NAV, giving child delta/share -1/10.
# Parent mean/share is 7/10 for aggressive-Good versus 2/5 for fair-Good. Both have tail loss 1/10.
# The carve-out's 1/10 tail ceiling rejects aggressive-Good (tail 31/15), retaining fair-Good at equality.
# Fair-Good has child mean 89/220 per share; the joint risk limit costs Parent 3/10 per share.
# Hold is best static; constrained adaptive value is 2/5 Parent USD/share. Parent closes at cash 30/20.
# These are separate already-net NAV assumptions, not an inferred sum of cash or ownership values.
# The fixed cash distribution occurs before the terminal share-for-asset terms. No subsequent
# distribution or automatic ownership update is assumed. No actual issuer agreement is represented.
