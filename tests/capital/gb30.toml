# Invented GB-30 exercise from plan section 23.10; not a real capital recommendation.
# Uses the five displayed joint-scenario payoffs, including rounded buyback inputs.
# The exact mean of D here is 61.18M, rather than the plan's one-decimal 61.2M.
# A+E: mean 372M, worst 20% signed loss 210M. A+D: mean 241.18M, loss 130.6M.
# The 150M loss cap selects A+D; expected-value cost of that cap is 130.82M.
schema = "fmine.capital-program.v1"
model_key = "invented-gb30-capital-program"
question = "Which static packages fit the invented 800M budget and 150M joint tail-loss limit?"
currency = "USD"
valuation_basis = "Invented nominal USD net delta-NAV at one valuation date, fixed share count and common economic ownership; all capital costs already included in payoffs; no additional discounting or synergies"
budget = "800000000"
tail_mass = "1/5"
max_tail_loss = "150000000"
payoff_convention = "additive_net_delta_nav"
reference_class_basis = "Explicitly unadjusted illustrative payoffs; no fitted reference-class, hazard or overrun model"

[[state]]
id = "s1_low_price_overrun"
weight = "1/5"

[[state]]
id = "s2_low"
weight = "1/5"

