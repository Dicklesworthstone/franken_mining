# SYNTHETIC: a 200 m horizontal hole with three independent 1-degree azimuth errors.
schema = "fmine.drill-composite.v1"
crs = "EPSG:32611"
evidence_lane = "synthetic"
survey_error_model = "random"
omitted_uncertainty = "Invented independent errors; no depth, CRS or systematic instrument uncertainty."

[[table]]
role = "collar"
path = "collars.csv"
format = "csv"

[[table]]
role = "survey"
path = "surveys.csv"
format = "csv"

[[table]]
role = "assay"
path = "assays.csv"
format = "csv"

[[hole]]
hole_id = "SYN-01"
program = "synthetic-known-answer"
hole_type = "diamond"
collar_from = "actual"
position_method = "dgnss"
sigma_horizontal_m = "0.2"
sigma_vertical_m = "0.3"
instrument = "gyro"
run = "in"
sigma_azimuth_deg = "1"
sigma_dip_deg = "0"
magnetic_interference = "false"
azimuth_reference = "grid"

# Length weights and method assignment are explicit; METHOD is absent in this synthetic CSV.
[[composite]]
column = "AU_GPT"
method = "fire_assay_aas"
unit = "g_per_t"
basis = "dry"
length_m = "60"
residual = "keep"

[[domain]]
hole_id = "SYN-01"
code = "upper"
from_m = "0"
to_m = "130"

[[domain]]
hole_id = "SYN-01"
code = "lower"
from_m = "130"
to_m = "200"
