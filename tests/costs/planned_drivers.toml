# Invented planned quantities and rates, not fitted costs or an issuer filing.
# Mining = 100.01 dry tonnes * 7.5 USD/dry tonne + 49.935 USD fixed = 800.01 USD.
# 2018 AISC = (800.01 + 300 + 100 - 200) / 100 = 10.0001 USD/oz sold.
# Run: fmine metrics cost --input tests/costs/planned_drivers.toml --definition aisc@wgc-2018
schema = "fmine.cost-worksheet.v1"
issuer = "invented"
subject = "Example Mine"
period = "2030FY"
ownership = "full"
basis = "Invented planned nominal USD costs on a complete sold-ounce population"
currency = "USD"
complete = "true"
ounces_sold = "100"

[[driver_cost]]
item = "on_site_mining_costs"
driver = "tonnes_mined"
unit = "dry_t"
quantity = "100.01"
usd_per_unit = "7.5"
fixed_usd = "49.935"

[[cost]]
item = "corporate_general_and_administrative"
usd = "300"

[[cost]]
item = "lease_payments"
usd = "100"

[[cost]]
item = "by_product_credits"
usd = "200"

[[cost]]
item = "income_tax"
usd = "999"

[[uu]]
id = "UU-example-omitted-cost"
description = "Invented cost category omitted from the declared population"
trigger = "Reconciliation finds an unclassified cost account"
downside_usd_m = "0.001"
