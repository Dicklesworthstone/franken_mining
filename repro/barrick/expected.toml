# Expected results of `fmine assure public --issuer barrick --through 2026Q2` on the 18 registered workbooks
# (BD-339.S1). Append-only: a change that moves the root appends a row in the same commit, with its reason and a
# bead or E id. Rows are never edited. The ignored real-file tests in fmine-public and fmine-cli check the last
# row.
#
# The state root is a regression value, not an independent oracle: it is BLAKE3 over the M0AS frame, which
# binds file names, digests, census numbers, every instance's state and detail text. The same bytes and the same
# code give the same root. The counts are checked against the independent readers in scripts/oracle/.
#
# registry_epoch: sha256 over the sorted "{file}\t{sha256}\n" lines of the registry rows the run used.
# census_digest_of_digests: sha256 over "{file}\t{numeric_digest}\n" in registry order. Both can be computed
# without this code: the numeric digests come from `python3 -I scripts/oracle/fidelity.py`.
#
# Every row was observed on 2026-10-30 by building that commit from `git archive` in its own target directory
# and running the CLI on the registered corpus. Rows before 04684ff come from code that had no --through flag;
# it read the same 18 files.

