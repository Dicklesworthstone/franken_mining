name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # AGENTS.md "Compiler Checks" (bd-l736): formatting and clippy, warnings denied. One OS is enough; lints do
  # not depend on the target here.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # BD-326 (bd-i787.2): advisories, bans, licences and sources over the graph of deny.toml's three targets. The
  # advisory database is fetched first, retried once, so the check itself runs offline.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Fetch the advisory database
        run: cargo deny fetch db || { sleep 15; cargo deny fetch db; }
      - name: cargo deny check
        run: cargo deny --locked --offline check advisories bans licenses sources

  check-and-test:
    name: ${{ matrix.os }} (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        profile: [dev, release]
    steps:
      # Full history: test_rules_commit_precedes_forecasts orders the rules and forecast commits (BD-334.S2).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run GATE-LAYERS-00 (xtask check-all)
        run: cargo run -p xtask -- check-all
      # BD-003 done-when: CI prints the per-crate LOC budget table (check-all prints only the totals).
      - name: LOC budget table
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'dev'
        run: cargo run -p xtask -- loc
      - name: Check workspace
        run: cargo check --workspace --all-targets --profile ${{ matrix.profile }}
      - name: Run workspace test suite
        run: cargo test --workspace --profile ${{ matrix.profile }}
      # Each public-lane kernel's golden digest line (bd-hp2j.3), in the run summary so one run shows both hosts.
      # The tests above already assert the committed values; this step only prints them, seven or it fails.
      - name: Golden digest lines
        if: matrix.profile == 'dev'
        shell: bash
        run: |
          cargo test -p fmine-numerics -p fmine-calib -p fmine-metrics --lib golden_digest -- --nocapture \
            --test-threads 1 > "$RUNNER_TEMP/digests.log"
          grep -o '{"kernel".*}' "$RUNNER_TEMP/digests.log" | sort > "$RUNNER_TEMP/digest_lines.txt"
          cat "$RUNNER_TEMP/digest_lines.txt"
          test "$(wc -l < "$RUNNER_TEMP/digest_lines.txt")" -eq 7
          { echo '```'; cat "$RUNNER_TEMP/digest_lines.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Every verb's printed envelope (bd-sjrh.3, PO-ADIT-1); the real-corpus run logs skipped: corpus_absent.
      - name: Envelope e2e
        if: matrix.profile == 'dev'
        run: bash tests/e2e_envelope.sh
      # The reproduction kit's fetch script against invented files over file:// (BD-339.S2): saving under the
      # registered name, a changed issuer file, a present mismatching file left alone, a non-bare file name.
      - name: Fetch kit offline test
        if: matrix.profile == 'dev'
        run: bash repro/barrick/test_fetch_offline.sh
      # The vintage registration script over file:// (bd-s9j3.2): candidate rows, the oracle seal, the
      # already-registered guard, a reused directory, a binary that is not the blind one, a changed oracle.
      - name: Vintage registration offline test
        if: matrix.profile == 'dev'
        run: bash scripts/test_register_vintage.sh
      # The public forecast record (BD-334.S1): hash, an RFC 3161 round trip with a throwaway local TSA, verify,
      # then planted defects refused (an OPEN marker, a changed forecast, a missing or a sold site's forecast,
      # changed rules, a re-hash, another record, a wrong chain, a digest that differs from the source registry, a
      # cut-off after the proof).
      - name: Forecast record e2e
        if: matrix.profile == 'dev'
        run: bash scripts/forecast_record_e2e.sh
      # The FY2026 rules were committed before any forecast (BD-334.S2); the test needs this full-history checkout.
      - name: Rules precede forecasts
        if: matrix.profile == 'dev'
        run: cargo test -p xtask forecast::tests::test_rules_commit_precedes_forecasts -- --ignored --exact
      # The stamped rules still verify on a machine outside the developers' systems (BD-334.S2).
      - name: Rules time proofs
        if: matrix.profile == 'dev'
        run: bash scripts/verify_rules_timestamp.sh
      # No issuer workbook or PDF is ever committed (OPEN-R7-1, bd-plx1), and no transcription row; synthetic
      # files are written outside the tree.
      - name: No workbook, PDF or transcription in git
        run: test -z "$(git ls-files '*.xlsx' '*.xls' '*.pdf' '*.PDF' 'registries/transcriptions/')"
      # The source registry is data read at run time (bd-s9j3.1): a vintage is registered by editing
      # registries/sources/<issuer>.toml, so the release binary must not carry a registry digest.
      - name: No compiled-in source registry
        if: matrix.profile == 'release'
        run: |
          cargo build -p fmine-cli --release
          ! LC_ALL=C grep -a -q e2e1243ec0549f4c487c773869876e2acade401a0b6cd1141adf4b9296aec840 target/release/fmine
