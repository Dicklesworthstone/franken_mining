name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    name: ${{ matrix.os }} (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v4
      - name: Run GATE-LAYERS-00 (xtask check-all)
        run: cargo run -p xtask -- check-all
      - name: Check workspace
        run: cargo check --workspace --all-targets --profile ${{ matrix.profile }}
      - name: Run workspace test suite
        run: cargo test --workspace --profile ${{ matrix.profile }}
