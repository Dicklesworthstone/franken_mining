name: CI

on:
  # main only: master is pushed as the same commit (AGENTS.md), so a run for master repeated every job at that SHA.
  push:
    branches: [main]
  pull_request:

jobs:
  # Keep the focused product regressions executable even when an independent workspace gate fails.
  forecast-and-production:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI for command integration tests
        run: cargo build -p fmine-cli --locked
      - name: Source-bound AISC and TCC cost bridges
        run: |
          cargo test -p fmine-cli --lib waterfall:: --locked
          cargo test -p xtask --test public_waterfall --locked
      - name: Exact production scheduling and independent command oracle
        run: |
          cargo test -p fmine-optimize --lib --locked
          python3 -I crates/xtask/testdata/plan_schedule_oracle.py target/debug/fmine
      - name: Exact HTML disclosure arithmetic and independent source oracle
        run: python3 -I crates/xtask/testdata/html_lint_oracle.py target/debug/fmine
      - name: Calibration, plant, valuation and capital known answers
        run: cargo test -p fmine-numerics -p fmine-calib -p fmine-plant -p fmine-decide -p fmine-metrics -p fmine-capital --lib --locked
      - name: Source-derived investment portfolios
        run: cargo test -p xtask --test capital_investments --locked
      - name: Saved forecast diagnostics and disclosure derivations
        run: cargo test -p xtask --test forecast_diagnostics --test forecast_live --test forecast_supplied_comparison --test public_lint_derivations --test production_valuation --locked
      - name: Source-bound journals, RTD inversion and citation integrity
        run: cargo test -p xtask --test decision_journal --test plant_rtd_inverse --test public_report_contract --test public_citations --locked
      - name: Plant command and journal integration
        run: cargo test -p fmine-cli --locked
      - name: Quarterly forecast records and source controls
        run: |
          cargo test -p fmine-public --lib --locked
          cargo test -p xtask --lib forecast:: --locked
          cargo test -p xtask --test quarterly_record_rules --test forecast_record_score --locked
      - name: Authenticated capex record within the frozen fixture's issuance window
        run: |
          capex_fixture_now=$(date -u +%s)
          capex_fixture_start=$(date -u -d '2026-10-03T00:00:00Z' +%s)
          capex_fixture_end=$(date -u -d '2026-12-31T23:59:45Z' +%s)
          if (( capex_fixture_now >= capex_fixture_start && capex_fixture_now < capex_fixture_end )); then
            cargo test -p xtask --test forecast_record_score capex_candidate_freezes_scores_exact_scopes_and_keeps_changed_ownership_unresolved --locked -- --ignored --exact
          else
            echo "::notice::The authenticated capex fixture is outside its declared 2026 issuance window; source and arithmetic capex regressions still run above."
          fi

  # AGENTS.md "Compiler Checks" (bd-l736): formatting and clippy, warnings denied. One OS is enough; lints do
  # not depend on the target here.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The fuzz targets (fuzz/, their own workspace; plan §32.4) are outside every workspace command above, so a
      # change to a decoder's API would break them unseen. scripts/fuzz.sh runs the full campaign.
      - name: Fuzz targets compile
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets
      # cargo-fuzz is built with stable: under rust-toolchain.toml's nightly its locked rustix 0.36.5 detects
      # rustc_attrs and uses attributes that nightly no longer has. `cargo fuzz run` still uses the pinned nightly.
      - name: Fuzz CLI exit codes and envelopes (PO-ADIT-4)
        run: |
          cargo +stable install cargo-fuzz --version 0.13.1 --locked
          python3 -I fuzz/seeds.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fmine-seeds"
          cargo fuzz run --dev --sanitizer none cli_run "$RUNNER_TEMP/fmine-seeds/cli_run" -- -runs=25000 -timeout=10

  # BD-326 (bd-i787.2): advisories, bans, licences and sources over the graph of deny.toml's three targets. The
  # advisory database is fetched first, retried once, so the check itself runs offline.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Fetch locked crate sources
        run: cargo fetch --locked || { sleep 15; cargo fetch --locked; }
      - name: Fetch the advisory database
        run: cargo deny fetch db || { sleep 15; cargo deny fetch db; }
      - name: cargo deny check
        run: cargo deny --locked --offline check advisories bans licenses sources

  check-and-test:
    name: ${{ matrix.os }} (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        profile: [dev, release]
    steps:
      # Full history: test_rules_commit_precedes_forecasts orders the rules and forecast commits (BD-334.S2).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # macos-15 puts Homebrew's OpenSSL 1.1 first on PATH. Before f44d600 its `ts -verify` could not build the
      # chain from the committed rules proof to the pinned DigiCert root ("unable to get local issuer
      # certificate", run 41322629628). f44d600 passes the embedded certificates as an untrusted chain, which
      # its author reports 1.1.1w verifying; no CI run has checked that yet. This step keeps macOS on OpenSSL 3,
      # which verifies the proof (3.6.5 and 4.0.3, locally). The forecast tests and scripts run `openssl` from PATH.
      - name: OpenSSL 3 first on PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix openssl@3)/bin/openssl" version
      - name: Run GATE-LAYERS-00 (xtask check-all)
        run: cargo run -p xtask -- check-all
      # §28.4.3 (BD-012): a change adding LOC to a crate over its planned budget needs an approved BUDGET-AMEND
      # record. The range starts at the pull request's base or the push's previous head; HEAD~1 for a new branch, or
      # when a force push left the previous head out of the checkout.
      - name: Budget amendments over the pushed range
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'dev'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=HEAD~1 ;; esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          echo "check-amend base: $BASE"
          cargo run -p xtask -- check-amend --base "$BASE"
      # BD-003 done-when: CI prints the per-crate LOC budget table (check-all prints only the totals).
      - name: LOC budget table
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'dev'
        run: cargo run -p xtask -- loc
      - name: Check workspace
        run: cargo check --workspace --all-targets --profile ${{ matrix.profile }}
      - name: Run workspace test suite
        run: cargo test --workspace --profile ${{ matrix.profile }}
      # Each public-lane kernel's golden digest line (bd-hp2j.3), in the run summary so one run shows both hosts.
      # The tests above already assert the committed values; this step only prints them, seven or it fails.
      - name: Golden digest lines
        if: matrix.profile == 'dev'
        shell: bash
        run: |
          cargo test -p fmine-numerics -p fmine-calib -p fmine-metrics --lib golden_digest -- --nocapture \
            --test-threads 1 > "$RUNNER_TEMP/digests.log"
          grep -o '{"kernel".*}' "$RUNNER_TEMP/digests.log" | sort > "$RUNNER_TEMP/digest_lines.txt"
          cat "$RUNNER_TEMP/digest_lines.txt"
          test "$(wc -l < "$RUNNER_TEMP/digest_lines.txt")" -eq 7
          { echo '```'; cat "$RUNNER_TEMP/digest_lines.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # GATE-DET-01 (BD-141, PO-NUM-1): all 18 disclosure-grade BitwisePortable families across 14 crates,
      # checked against fixtures/det/bitwise_portable_families.txt on both ISAs and both profiles.
      - name: GATE-DET-01 BitwisePortable families
        shell: bash
        run: |
          cargo test -p fmine-gen --lib --profile ${{ matrix.profile }} det_families:: -- --nocapture \
            --test-threads 1 > "$RUNNER_TEMP/det_families.log"
          grep -o '{"family".*}' "$RUNNER_TEMP/det_families.log" | sort > "$RUNNER_TEMP/det_families.txt"
          cat "$RUNNER_TEMP/det_families.txt"
          test "$(wc -l < "$RUNNER_TEMP/det_families.txt")" -eq 18
          { echo '### GATE-DET-01 (18 families)'; echo '```'; cat "$RUNNER_TEMP/det_families.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # BD-099/BD-100/BD-097/BD-337: LabRuntime virtual-time replay (seeds 0..999), DPOR, CrashPack, PO-BED-8, invariance.
      - name: LabRuntime seeds 0..999, DPOR, chaos and PO-BED-8
        if: matrix.profile == 'dev'
        run: cargo test -p fmine-lab --lib --locked
      # Every verb's printed envelope (bd-sjrh.3, PO-ADIT-1); the real-corpus run logs skipped: corpus_absent.
      - name: Envelope e2e
        if: matrix.profile == 'dev'
        run: bash tests/e2e_envelope.sh
      # BD-142 [WP-07]: tests/e2e NDJSON logging harness and CrashPack self-test against real `fmine`.
      - name: E2E NDJSON harness and CrashPack self-test
        if: matrix.profile == 'dev'
        run: bash tests/e2e/self_test.sh
      # The reproduction kit's fetch script against invented files over file:// (BD-339.S2): saving under the
      # registered name, a changed issuer file, a present mismatching file left alone, a non-bare file name.
      - name: Fetch kit offline test
        if: matrix.profile == 'dev'
        run: bash repro/barrick/test_fetch_offline.sh
      # The vintage registration script over file:// (bd-s9j3.2): candidate rows, the oracle seal, the
      # already-registered guard, a reused directory, a binary that is not the blind one, a changed oracle.
      - name: Vintage registration offline test
        if: matrix.profile == 'dev'
        run: bash scripts/test_register_vintage.sh
      # The public forecast record (BD-334.S1): hash, an RFC 3161 round trip with a throwaway local TSA, verify,
      # then planted defects refused (an OPEN marker, a changed forecast, a missing or a sold site's forecast,
      # changed rules, a re-hash, another record, a wrong chain, a digest that differs from the source registry, a
      # cut-off after the proof).
      - name: Forecast record e2e
        if: matrix.profile == 'dev'
        run: bash scripts/forecast_record_e2e.sh
      # The FY2026 rules were committed before any forecast (BD-334.S2); the test needs this full-history checkout.
      - name: Rules precede forecasts
        if: matrix.profile == 'dev'
        run: cargo test -p xtask forecast::tests::test_rules_commit_precedes_forecasts -- --ignored --exact
      # The stamped rules still verify on a machine outside the developers' systems (BD-334.S2).
      - name: Rules time proofs
        if: matrix.profile == 'dev'
        run: bash scripts/verify_rules_timestamp.sh
      # No issuer workbook or PDF is ever committed (OPEN-R7-1, bd-plx1), and no transcription row; synthetic
      # files are written outside the tree.
      - name: No workbook, PDF or transcription in git
        run: test -z "$(git ls-files '*.xlsx' '*.xls' '*.pdf' '*.PDF' 'registries/transcriptions/')"
      # The source registry is data read at run time (bd-s9j3.1): a vintage is registered by editing
      # registries/sources/<issuer>.toml, so the release binary must not carry a registry digest.
      - name: No compiled-in source registry
        if: matrix.profile == 'release'
        run: |
          cargo build -p fmine-cli --release
          ! LC_ALL=C grep -a -q e2e1243ec0549f4c487c773869876e2acade401a0b6cd1141adf4b9296aec840 target/release/fmine
