[package]
name = "fmine-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true
description = "Std-only offline verifier of FMT-CERT-1 certificates, FMT-CAS-1 roots, SyncCert MMR consistency proofs, and FMT-SEG-1 ledger segments (BD-140, GOAL-024)."

[lints]
workspace = true

[dependencies]
fmine-core = { path = "../fmine-core" }
fmine-evidence = { path = "../fmine-evidence" }
fmine-ledger = { path = "../fmine-ledger" }
fmine-object = { path = "../fmine-object" }
fmine-sync = { path = "../fmine-sync" }

[dev-dependencies]
fmine-gen = { path = "../fmine-gen" }
fmine-lab = { path = "../fmine-lab" }
fmine-optimize = { path = "../fmine-optimize" }
fmine-units = { path = "../fmine-units" }
